      <script>
        pagedata = ["Crimson Isle", "#f0a040"];

        /*
          type:     "primary"    -> rolled via weights (only one primary drop per kill)
                    "guaranteed" -> always drops (Derelict Ashe)
                    "extra"      -> may drop in addition to the primary drop
                    "fixed"      -> always drops at a fixed rate
          weight:   drop weight (primary and extra items only)
          quantity: how many of the item drop at once
          market:   "bz" (Bazaar) or "ah" (Auction House LBIN)
          npcPrice: coins when sold to an NPC
        */
        const ITEMS = {
          ARROW_BUNDLE_MAGMA:               { name: "Bundle of Magma Arrows",          type: "primary",    weight: 1500, quantity: 1,   market: "bz", npcPrice: 50000 },
          ENCHANTED_BLAZE_POWDER:           { name: "Enchanted Blaze Powder",          type: "primary",    weight: 1500, quantity: 28,  market: "bz", npcPrice: 1440 },
          SHARD_BURNINGSOUL:                { name: "Inferno Demonlord Shard",         type: "primary",    weight: 1000, quantity: 1,   market: "bz", npcPrice: 0 },
          CRUDE_GABAGOOL_DISTILLATE:        { name: "Gabagool Distillate",             type: "primary",    weight: 840,  quantity: 28,  market: "bz", npcPrice: 5000 },
          MANA_DISINTEGRATOR:               { name: "Mana Disintegrator",              type: "primary",    weight: 700,  quantity: 1,   market: "bz", npcPrice: 0 },
          SCORCHED_POWER_CRYSTAL:           { name: "Scorched Power Crystal",          type: "primary",    weight: 600,  quantity: 1,   market: "bz", npcPrice: 350000 },
          FLAWED_OPAL_GEM:                  { name: "Flawed Opal Gemstones",           type: "primary",    weight: 550,  quantity: 320, market: "bz", npcPrice: 640 },
          POTION_wisp_ice:                  { name: "Wisp's Ice-Flavored Water",       type: "primary",    weight: 500,  quantity: 5,   market: "ah", npcPrice: 20000 },
          KELVIN_INVERTER:                  { name: "Kelvin Inverter",                 type: "primary",    weight: 500,  quantity: 1,   market: "bz", npcPrice: 100000 },
          SCORCHED_BOOKS:                   { name: "Scorched Books",                  type: "primary",    weight: 400,  quantity: 1,   market: "bz", npcPrice: 1 },
          ENCHANTMENT_ULTIMATE_REITERATE_1: { name: "Enchanted Book (Duplex I)",       type: "primary",    weight: 350,  quantity: 1,   market: "bz", npcPrice: 0 },
          ENCHANTMENT_FIRE_ASPECT_3:        { name: "Enchanted Book (Fire Aspect III)",type: "primary",    weight: 250,  quantity: 1,   market: "bz", npcPrice: 0 },
          ARCHFIEND_DICE:                   { name: "Archfiend Dice",                  type: "primary",    weight: 200,  quantity: 1,   market: "ah", npcPrice: 0 },
          HIGH_CLASS_ARCHFIEND_DICE:        { name: "High Class Archfiend Dice",       type: "primary",    weight: 50,   quantity: 1,   market: "ah", npcPrice: 0 },
          WILSON_ENGINEERING_PLANS:         { name: "Wilson's Engineering Plans",      type: "primary",    weight: 17,   quantity: 1,   market: "ah", npcPrice: 0 },
          SUBZERO_INVERTER:                 { name: "Subzero Inverter",                type: "primary",    weight: 17,   quantity: 1,   market: "bz", npcPrice: 0 },

          DERELICT_ASHE:                    { name: "Derelict Ashe",                   type: "guaranteed",               quantity: 133, market: "bz", npcPrice: 0 },

          
          RUNE_LAVATEARS:                   { name: "Lavatears Rune I",                type: "extra",      weight: 450,  quantity: 1,   market: "ah", npcPrice: 1 },
          RUNE_FIERY_BURST:                 { name: "Fiery Burst Rune I",              type: "extra",      weight: 40,   quantity: 1,   market: "ah", npcPrice: 1 },
          SHARD_PARAGON:                    { name: "Paragon Shard",                   type: "fixed",      chance: 0.0025, quantity: 1,  market: "bz", npcPrice: 0 },
        };

        const keysOfType = type => Object.keys(ITEMS).filter(k => ITEMS[k].type === type);
        const ALL_KEYS = Object.keys(ITEMS);

        function buildWeights(type) {
          const out = {};
          for (const key of keysOfType(type)) out[key] = ITEMS[key].weight;
          return out;
        }

        var weights = buildWeights("primary");
        var extraweights = buildWeights("extra");
        var chances = {};   // filled in by updateChances()
        var cpks = {};      // coins-per-kill contribution of each item
        for (const key of ALL_KEYS) {
          chances[key] = ITEMS[key].type === "guaranteed" ? 1
          : ITEMS[key].type === "fixed" ? ITEMS[key].chance
          : 0;
          cpks[key] = 0;
        }

        function makeCell(text, { right = false, paddingLeft = null } = {}) {
          const td = document.createElement("td");
          if (right) {
            td.className = "tdalignright";
            td.style.textAlign = "right";
          }
          if (paddingLeft) td.style.paddingLeft = paddingLeft;
          if (text !== undefined) td.innerText = text;
          return td;
        }

        function appendRow(key) {
          const item = ITEMS[key];
          const row = document.createElement("tr");

          const itemname = makeCell(item.type === "guaranteed" ? item.name + ": " : "Chance of " + item.name + ": ");
          const itemchance = makeCell(item.type === "guaranteed" ? "100%" : undefined, { right: true });
          itemchance.id = "chance_" + key;

          const sellselector = document.createElement("select");
          sellselector.id = key + "_sell_method";
          sellselector.onchange = () => updateProfit(key);
          sellselector.style.width = "145px";

          const methods = item.market === "bz"
            ? [["insta", "Bazaar Insta-sell"], ["order", "Bazaar Sell Order"]]
            : [["ah", "Auction House LBIN"]];
          methods.push(["npc", "Sell to NPC"]);
          for (const [value, label] of methods) {
            const opt = document.createElement("option");
            opt.value = value;
            opt.innerText = label;
            sellselector.appendChild(opt);
          }
          const itemsellselect = makeCell(undefined, { paddingLeft: "10px" });
          itemsellselect.appendChild(sellselector);

          const itemcpk = makeCell("0 coins (+0 c/k)", { right: true, paddingLeft: "10px" });
          itemcpk.id = key + "_cpk";

          row.append(itemname, itemchance, itemsellselect, itemcpk);
          loottable_blaze.appendChild(row);
        }

        function initializeTable() {
          keysOfType("primary").forEach(appendRow);
          keysOfType("guaranteed").forEach(appendRow);

          // Divider + note
          const divider = document.createElement("tr");
          const dividertd = document.createElement("td");
          const dividerhr = document.createElement("hr");
          dividerhr.className = "solid";
          dividertd.appendChild(dividerhr);
          divider.append(dividertd, document.createElement("td"));
          loottable_blaze.appendChild(divider);

          const divider2 = document.createElement("tr");
          const dividertd2 = document.createElement("td");
          const dividerspan = document.createElement("span");
          dividerspan.className = "fineprint";
          dividerspan.innerText = "The following drops may be obtained in addition to the primary drop.";
          dividertd2.appendChild(dividerspan);
          divider2.appendChild(dividertd2);
          loottable_blaze.appendChild(divider2);

          keysOfType("extra").forEach(appendRow);
          keysOfType("fixed").forEach(appendRow);

          // Total row
          const totalrow = document.createElement("tr");
          totalrow.style.marginTop = "10px";
          const totaltd4 = makeCell(undefined, { right: true });
          totaltd4.style.color = "#ffaa00";
          totaltd4.id = "totalprofit";
          totalrow.append(makeCell("Total profit: "), makeCell(), makeCell(), totaltd4);
          loottable_blaze.appendChild(totalrow);
        }

        async function updateAllChances() {
          weights = buildWeights("primary");
          extraweights = buildWeights("extra");
          updateBazaar();
          // see slayercalc.js
          await updateChances(weights, extraweights);
          updateFixedChances();
          ALL_KEYS.forEach(updateProfit);
        }

        function updateFixedChances() {
          for (const key of keysOfType("fixed")) {
            const chance = ITEMS[key].chance;
            const cell = document.getElementById("chance_" + key);
            cell.className = "basictext";
            cell.innerText = frac.value == 0
              ? (chance * 100).toFixed(3) + "%"
              : "1/" + (1 / chance).toFixed(1);
          }
        }

        function updatePage() {
          console.log("Initializing...");
          initializeTable();
          updateAllChances();
        }

        function abbreviate(input) {
          if (input >= 1000000) return (input / 1000000).toFixed(1) + "M";
          if (input >= 1000) return (input / 1000).toFixed(1) + "K";
          return String(Math.round(input * 10) / 10);
        }

        // Cache AH lookups for 30s so repeated recalculations don't spam the Coflnet API.
        const lbinCache = {};
        const LBIN_TTL_MS = 30000;

        /*
          To prevent outliers from producing unrealistic results, this uses the lowest BIN
          within 80% of the average of the 5 lowest BINs.
        */
        async function getLowestBin(key) {
          const cached = lbinCache[key];
          if (cached && Date.now() - cached.time < LBIN_TTL_MS) return cached.price;

          const res = await fetch("https://sky.coflnet.com/api/auctions/tag/" + key + "/active/bin");
          if (!res.ok) {
            console.log("Error looking up " + key);
            return 0;
          }
          const data = await res.json();
          const prices = data.slice(0, 5).map(a => a.startingBid);
          if (prices.length === 0) return 0;

          const average = prices.reduce((a, b) => a + b, 0) / prices.length;
          let j = 0;
          while (j < prices.length - 1 && prices[j] < 0.8 * average) j++;

          lbinCache[key] = { price: prices[j], time: Date.now() };
          return prices[j];
        }

        async function getUnitPrice(key, method) {
          const item = ITEMS[key];
          switch (method) {
            case "npc":
              return item.npcPrice;
            case "order":
              return bazaardata?.products?.[key]?.quick_status.buyPrice ?? null;
            case "insta":
              return bazaardata?.products?.[key]?.quick_status.sellPrice ?? null;
            case "ah":
              return await getLowestBin(key);
          }
          return null;
        }

        async function updateProfit(key) {
          const method = document.getElementById(key + "_sell_method").value;
          const unitPrice = await getUnitPrice(key, method);
          if (unitPrice === null) return; // Bazaar data hasn't loaded yet

          const stackValue = unitPrice * ITEMS[key].quantity;
          const cpk = stackValue * chances[key];
          setCpkCell(key, stackValue, cpk);
          cpks[key] = cpk;
          const profitsum = Object.values(cpks).reduce((a, b) => a + b, 0);
          totalprofit.innerText = Number(profitsum.toFixed(1)).toLocaleString() + " c/k";
          updateCpkColors();
        }

        var onCD;
        var bazaardata;
        async function updateBazaar() {
          if (onCD == true) {
            console.log("On cooldown!");
            return -1;
          }
          onCD = true;
          setTimeout(() => { onCD = false }, 5000);

          const apicall = await fetch("https://api.hypixel.net/skyblock/bazaar");
          if (!apicall.ok) {
            console.log("Api call error");
            return -1;
          }
          bazaardata = await apicall.json();
          ALL_KEYS.forEach(updateProfit);
        }

        const COLOR_LOW  = [0xc0, 0xc0, 0xc0];  // #c0c0c0
        const COLOR_HIGH = [0xff, 0xa0, 0x00];  // #ffc000

        function lerpColor(t) {
          const rgb = COLOR_LOW.map((lo, i) => Math.round(lo + (COLOR_HIGH[i] - lo) * t));
          return "rgb(" + rgb.join(",") + ")";
        }

        function setCpkCell(key, stackValue, cpk) {
          const cell = document.getElementById(key + "_cpk");
          const span = document.createElement("span");
          span.id = key + "_cpkvalue";
          span.innerText = "+" + abbreviate(cpk) + " c/k";
          cell.replaceChildren(
            document.createTextNode(abbreviate(stackValue) + " coins ("),
            span,
            document.createTextNode(")")
          );
        }

        function updateCpkColors() {
          const values = Object.values(cpks).filter(Number.isFinite);
          const max = Math.max(0, ...values);
          for (const key of ALL_KEYS) {
            const span = document.getElementById(key + "_cpkvalue");
            if (!span) continue;                       
            const t = max > 0 && Number.isFinite(cpks[key]) ? cpks[key] / max : 0;
            span.style.color = lerpColor(t);
          }
        }
      </script>
